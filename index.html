<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.E.R.O. Core System Interface</title>
  <style>
    :root {
      --primary-color: #00ff66;
      --bg-color: #050a06;
      --panel-bg: rgba(5, 20, 10, 0.7);
      --border-color: rgba(0, 255, 102, 0.3);
      --glow-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary-color);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    /* Ambient Lighting Effect */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, transparent 30%, var(--primary-color));
      opacity: 0.15;
      pointer-events: none;
      transition: background 0.5s ease;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: var(--glow-shadow);
      z-index: 10;
    }

    .system-title {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--primary-color);
    }

    .status-badge {
      padding: 5px 12px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      font-size: 0.85rem;
      box-shadow: inset 0 0 8px var(--primary-color);
    }

    /* Main Grid Layout */
    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 20px;
      padding: 20px;
      height: calc(100vh - 70px);
      z-index: 5;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--glow-shadow);
      backdrop-filter: blur(5px);
    }

    .panel-header {
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* Left Code Terminal */
    .code-terminal {
      font-size: 0.8rem;
      line-height: 1.4;
      overflow-y: hidden;
      white-space: pre-wrap;
      color: var(--primary-color);
      opacity: 0.9;
      height: 100%;
    }

    /* Center Visualizer */
    .visualizer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .aero-sphere {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 2px dashed var(--primary-color);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotateSphere 20s linear infinite;
      box-shadow: 0 0 40px var(--primary-color);
    }

    .inner-core {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
      opacity: 0.8;
      animation: pulseCore 2s ease-in-out infinite alternate;
    }

    .orbit-ring {
      position: absolute;
      width: 340px;
      height: 340px;
      border: 1px solid var(--primary-color);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spinOrbit 6s linear infinite;
    }

    /* Right Interaction & Controls */
    .log-stream {
      flex-grow: 1;
      font-size: 0.8rem;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .log-entry {
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .shortcut-guide {
      font-size: 0.75rem;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .shortcut-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    /* Keyframe Animations */
    @keyframes rotateSphere {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinOrbit {
      0% { transform: rotateX(70deg) rotateZ(0deg); }
      100% { transform: rotateX(70deg) rotateZ(360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 0.9; }
    }

    /* Glitch effect for Angry Mode */
    .glitch {
      animation: glitchAnim 0.2s infinite;
    }

    @keyframes glitchAnim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>

  <header>
    <div class="system-title">A.E.R.O. // NEURAL CORE</div>
    <div class="status-badge" id="statusBadge">MODE: CALM / NORMAL</div>
  </header>

  <div class="dashboard">
    <!-- Left: Coding Terminal Panel -->
    <div class="panel">
      <div class="panel-header">// REALTIME SCRIPT GENERATOR</div>
      <div class="code-terminal" id="codeTerminal"></div>
    </div>

    <!-- Center: Interactive Sphere -->
    <div class="panel visualizer-container" id="visualizerPanel">
      <div class="orbit-ring"></div>
      <div class="aero-sphere" id="mainSphere">
        <div class="inner-core" id="innerCore"></div>
      </div>
    </div>

    <!-- Right: Logs & Key Controls -->
    <div class="panel">
      <div class="panel-header">// SYSTEM LOGS</div>
      <div class="log-stream" id="logStream">
        <div class="log-entry">> Initializing A.E.R.O. Engine v2.4...</div>
        <div class="log-entry">> Neural Network connected.</div>
        <div class="log-entry">> Awaiting Rayzen input...</div>
      </div>

      <div class="shortcut-guide">
        <div class="panel-header" style="margin-bottom:8px; border:none;">// HOTKEYS (PRESS 1-4)</div>
        <div class="shortcut-item"><span>[1] Calm Mode</span><span>Green</span></div>
        <div class="shortcut-item"><span>[2] Angry / Roast</span><span>Red</span></div>
        <div class="shortcut-item"><span>[3] Thinking</span><span>Yellow</span></div>
        <div class="shortcut-item"><span>[4] Sarcastic</span><span>Purple</span></div>
      </div>
    </div>
  </div>

  <script>
    // Fake Code Stream Generator for Left Panel
    const codeLines = [
      "function initAeroProtocol() {",
      "  const syncTarget = 'Rayzen';",
      "  let systemState = 'OPTIMAL';",
      "  console.log(`Connecting to ${syncTarget}...`);",
      "  return new Promise((resolve) => {",
      "    setInterval(() => {",
      "      processNeuralPulsing();",
      "    }, 100);",
      "  });",
      "}",
      "async function processNeuralPulsing() {",
      "  const dataBuffer = crypto.getRandomValues(new Uint8Array(16));",
      "  if (dataBuffer[0] > 200) {",
      "    triggerGlitchEvent();",
      "  }",
      "}",
      "// Executing subroutines...",
      "initAeroProtocol();"
    ];

    const codeTerminal = document.getElementById('codeTerminal');
    let lineIdx = 0;
    
    setInterval(() => {
      codeTerminal.innerHTML += codeLines[lineIdx % codeLines.length] + "\n";
      lineIdx++;
      if (codeTerminal.innerText.split('\n').length > 30) {
        codeTerminal.innerText = codeTerminal.innerText.split('\n').slice(10).join('\n');
      }
    }, 600);

    // Mood & Color Controls via Keybinds
    const moodMap = {
      '1': {
        name: 'MODE: CALM / NORMAL',
        color: '#00ff66',
        bg: '#050a06',
        panelBg: 'rgba(5, 20, 10, 0.7)',
        glitch: false
      },
      '2': {
        name: 'MODE: ANGRY / ROAST',
        color: '#ff1a1a',
        bg: '#140303',
        panelBg: 'rgba(30, 5, 5, 0.7)',
        glitch: true
      },
      '3': {
        name: 'MODE: THINKING / PROCESSING',
        color: '#ffcc00',
        bg: '#120f02',
        panelBg: 'rgba(25, 20, 5, 0.7)',
        glitch: false
      },
      '4': {
        name: 'MODE: SARCASTIC / SMIRK',
        color: '#d946ef',
        bg: '#100314',
        panelBg: 'rgba(25, 5, 30, 0.7)',
        glitch: false
      }
    };

    const root = document.documentElement;
    const statusBadge = document.getElementById('statusBadge');
    const logStream = document.getElementById('logStream');
    const visualizerPanel = document.getElementById('visualizerPanel');

    function switchMood(key) {
      const mood = moodMap[key];
      if (!mood) return;

      root.style.setProperty('--primary-color', mood.color);
      root.style.setProperty('--bg-color', mood.bg);
      root.style.setProperty('--panel-bg', mood.panelBg);
      root.style.setProperty('--border-color', mood.color + '4D');
      root.style.setProperty('--glow-shadow', `0 0 25px ${mood.color}66`);

      statusBadge.innerText = mood.name;

      // Add log
      const log = document.createElement('div');
      log.className = 'log-entry';
      log.innerText = `> ${mood.name} Activated.`;
      logStream.appendChild(log);
      logStream.scrollTop = logStream.scrollHeight;

      // Glitch effect toggle
      if (mood.glitch) {
        visualizerPanel.classList.add('glitch');
      } else {
        visualizerPanel.classList.remove('glitch');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['1', '2', '3', '4'].includes(e.key)) {
        switchMood(e.key);
      }
    });
  </script>
</body>
</html>
